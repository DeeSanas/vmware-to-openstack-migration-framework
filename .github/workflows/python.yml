name: Validate Migration Toolkit

on:
  push:
    paths:
      - 'scripts/**'
      - 'templates/**'
      - '.github/workflows/python.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'templates/**'
      - '.github/workflows/python.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile Python
        run: python -m py_compile scripts/readiness_report.py

      - name: Run sample inventory report
        run: python scripts/readiness_report.py templates/workload-inventory.csv
