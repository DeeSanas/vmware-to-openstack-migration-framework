name: Validate Database Migration Project

on:
  push:
    paths:
      - "projects/database-cloud-migration-architecture/**"
      - ".github/workflows/database-migration.yml"
  pull_request:
    paths:
      - "projects/database-cloud-migration-architecture/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Assess example database inventory
        run: python projects/database-cloud-migration-architecture/scripts/assess_database.py projects/database-cloud-migration-architecture/templates/database-inventory.csv
